<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: deep void to forge-amber glow -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a1530"/>
      <stop offset="55%" stop-color="#0d0a1a"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <!-- Amber forge gradient for the hammer -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Hot edge gradient for accents -->
    <linearGradient id="hotEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="amberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- Clip path for rounded square -->
    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <g clip-path="url(#roundClip)">
    <!-- Subtle grid pattern -->
    <g opacity="0.08" stroke="#fbbf24" stroke-width="1" fill="none">
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
    </g>

    <!-- Ambient glow behind hammer -->
    <circle cx="256" cy="230" r="140" fill="#fbbf24" opacity="0.18" filter="url(#softGlow)"/>
    <circle cx="256" cy="230" r="90" fill="#f59e0b" opacity="0.25" filter="url(#softGlow)"/>

    <!-- Sparks (small dots radiating) -->
    <g fill="#fef3c7" opacity="0.85">
      <circle cx="160" cy="140" r="3"/>
      <circle cx="350" cy="150" r="2.5"/>
      <circle cx="380" cy="240" r="2"/>
      <circle cx="140" cy="250" r="2"/>
      <circle cx="180" cy="320" r="2.5"/>
      <circle cx="340" cy="330" r="3"/>
      <circle cx="256" cy="110" r="2"/>
      <circle cx="120" cy="190" r="1.5"/>
      <circle cx="392" cy="190" r="1.5"/>
    </g>

    <!-- Hammer (forge hammer, rotated 45°) -->
    <g transform="translate(256, 256) rotate(-45)" filter="url(#amberGlow)">
      <!-- Handle (diagonal, goes to bottom-left) -->
      <rect x="-18" y="20" width="36" height="180" rx="14" fill="url(#amberGrad)"/>
      <!-- Handle darker outline -->
      <rect x="-18" y="20" width="36" height="180" rx="14" fill="none" stroke="#92400e" stroke-width="2" opacity="0.5"/>
      <!-- Handle grip rings -->
      <line x1="-18" y1="60" x2="18" y2="60" stroke="#92400e" stroke-width="2" opacity="0.6"/>
      <line x1="-18" y1="100" x2="18" y2="100" stroke="#92400e" stroke-width="2" opacity="0.6"/>
      <line x1="-18" y1="140" x2="18" y2="140" stroke="#92400e" stroke-width="2" opacity="0.6"/>

      <!-- Hammer head (horizontal bar at top) -->
      <rect x="-72" y="-32" width="144" height="64" rx="10" fill="url(#amberGrad)"/>
      <!-- Hammer head darker outline -->
      <rect x="-72" y="-32" width="144" height="64" rx="10" fill="none" stroke="#92400e" stroke-width="2.5" opacity="0.6"/>
      <!-- Hammer head highlight (top edge) -->
      <rect x="-66" y="-26" width="132" height="10" rx="4" fill="#fef3c7" opacity="0.7"/>
      <!-- Hammer head shadow (bottom edge) -->
      <rect x="-66" y="14" width="132" height="8" rx="3" fill="#7c2d12" opacity="0.5"/>

      <!-- Striker (smaller block on right side of head, like a pickaxe) -->
      <rect x="60" y="-14" width="44" height="28" rx="6" fill="url(#hotEdge)"/>
      <rect x="60" y="-14" width="44" height="28" rx="6" fill="none" stroke="#92400e" stroke-width="2" opacity="0.6"/>

      <!-- Connection rivet -->
      <circle cx="0" cy="0" r="6" fill="#7c2d12"/>
      <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    </g>

    <!-- Forge "N" badge at bottom -->
    <g transform="translate(256, 430)">
      <!-- Circle backdrop -->
      <circle cx="0" cy="0" r="36" fill="#0d0a1a" stroke="#fbbf24" stroke-width="2.5" opacity="0.95"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
      <!-- Letter N -->
      <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="38" font-weight="900"
            fill="url(#amberGrad)" text-anchor="middle" dominant-baseline="central">N</text>
    </g>
  </g>

  <!-- Outer rounded border (subtle) -->
  <rect x="1" y="1" width="510" height="510" rx="111" ry="111" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>
</svg>
